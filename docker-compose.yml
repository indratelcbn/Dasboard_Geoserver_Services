services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: geodb
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geodb"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gis

  # Application database — auth, users, settings (kept separate from spatial data)
  appdb:
    image: postgres:17-alpine
    container_name: appdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: app123
      POSTGRES_DB: appdb
    volumes:
      - ./postgres/app-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gis

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.0
    container_name: geoserver
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: Admin@123
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      EXTRA_JAVA_OPTS: "-Xms6G -Xmx12G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -Djava.awt.headless=true"
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "importer,css,vectortiles,mbstyle,monitor,wps"
      PROXY_BASE_URL: "http://10.10.175.112/geoserver"
    volumes:
      - ./geoserver/data:/opt/geoserver_data
      - /mnt/nasdata3:/data/nasdata3:ro
    expose:
      - "8080"
    cpus: "16"
    mem_limit: 20g
    networks:
      - gis

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - geoserver
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    networks:
      - gis

  geoserver-init:
    image: curlimages/curl:8.16.0
    container_name: geoserver-init
    depends_on:
      - geoserver
    volumes:
      - ./scripts/init.sh:/init.sh:ro
    entrypoint:
      - sh
      - /init.sh
    restart: "no"
    networks:
      - gis

  # --- Dashboard services ---
  dashboard-backend:
    build: ./backend
    container_name: dashboard-backend
    restart: unless-stopped
    depends_on:
      - geoserver
      - postgis
      - appdb
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_PUBLIC_URL: http://10.10.175.112/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: Admin@123
      PGHOST: postgis
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres123
      PGDATABASE: geodb
      DATABASE_URL: postgresql://appuser:app123@appdb:5432/appdb
    ports:
      - "4000:4000"
    networks:
      - gis

  dashboard-frontend:
    build: ./frontend
    container_name: dashboard-frontend
    restart: unless-stopped
    depends_on:
      - dashboard-backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    networks:
      - gis

networks:
  gis:
    driver: bridge
